<script type="module">
import * as THREE from 'three';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

// ---------------------------------------------------------------- parameters
const now = new Date();
const query = new URLSearchParams(location.search);
const P = {
  view:        ['spiral', 'coil', 'linear', 'week'].includes(query.get('view')) ? query.get('view') : 'spiral',
  flow:        'inward',  // 'inward': future spirals toward the centre, past falls off the outer edge.
                          // 'outward': the reverse, past descends into the well.
  growth:      'log',  // 'linear': turns equally spaced. 'log': each turn is a fixed multiple
                       // of the previous one, so the spiral is self-similar under scaling.
  coneAngle:   35,     // 0 = flat spiral in the screen plane, 90 = cylinder wall
  turnSpacing: 1.55,    // distance between turn 0 and turn 1, measured along the cone surface
  ribbonFill:  0.9,   // ribbon width as a fraction of the local turn spacing (1 = touching)
  baseRadius:  6,      // radius of the ribbon centreline at s = 0 (today's midnight)
  coilPitch:   0.8,    // coil view: how far each day's loop advances, in loop diameters
  daysPast:    2,
  daysFuture:  3,
  tilt:        0,      // camera tilt in degrees, 0 = straight down (the 2D view); set below per view
  spin:        0,
  zoom:        1,
  followTime:  true,   // keep the "now" marker fixed on screen as time passes
  morph:       1,      // progress of the current view transition, 0 = from, 1 = to
  nowHour:     Number.isFinite(parseFloat(query.get('hour'))) ? parseFloat(query.get('hour'))
               : now.getHours() + now.getMinutes() / 60,   // continuous, never wraps
  live:        !query.has('hour'),   // follow the real clock; turned off by play or by setting the time
  play:        false,
  speed:       0.1,    // hours per second while playing
  showTasks:   true,
  showTicks:   true,
  showEdges:   true,
  hourBands:   true,
  labels:      true,   // hour / day labels and the now readout, as a screen-space overlay
  taskLabels:  true,   // task names riding on the ribbon
  icons:       true,   // sun, reminder and deadline icons as a screen-space overlay
  curvedLabels: true,  // event names follow the ribbon's curve on the spiral and coil
  labelDays:   3,      // task names only within this many days of now
  pastDim:     0.45,   // how much the past is darkened, 0..1
  pastDesat:   0.7,    // how much the past is desaturated, 0..1
  pastEdge:    3,      // hours over which the past treatment ramps up behind the present
  presentBehind: 3,    // hours behind the marker still shown at full strength: today...
  presentSpan: 15,     // ...through this many hours ahead of it
  nowBehind:   1,      // the "now" focus inside today: from this many hours behind the marker...
  nowAhead:    3,      // ...to this many ahead, marked by amber ribbon edges and a little extra light
  nowLift:     0.1,    // extra brightness on the now stretch, 0..1
  nowEdges:    true,
  futureEdge:  3,      // hours over which the future treatment ramps up after the present
  futureDim:   0.3,    // how much the future beyond the present is darkened, 0..1
  futureDesat: 0.45,   // how much the future beyond the present is desaturated, 0..1
  presentLift: 0.12,   // extra brightness on the present, 0..1
  endFade:     6,      // hours of feathering at both ends of the ribbon; the past end is extended by this
};

// ---------------------------------------------------------------- helpers
const BG = new THREE.Color('#101216');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const Z = new THREE.Vector3(0, 0, 1);
const nowDay = () => P.nowHour / 24;
// real time in hours since the load day's midnight, so it keeps counting past midnight
const liveHour = () => (Date.now() - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 3.6e6;
const easeInOut = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const esc = str => String(str).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
if (P.view === 'coil') { P.tilt = 80; P.spin = -128.5; }

// ---------------------------------------------------------------- spiral geometry
// Cone frame. The spiral lives on the surface of a cone whose generatrix through
// (r = baseRadius, z = 0) makes angle `a` with the horizontal. rho = distance from the
// apex along the generatrix. The helix is rho(s), and the ribbon is offset across rho.
// dir = +1 when time flows outward (rho grows with s), -1 when it flows inward.
function spiralFrame() {
  const aDeg = P.growth === 'log' ? Math.min(P.coneAngle, 85) : P.coneAngle;
  const a  = THREE.MathUtils.degToRad(aDeg);
  const ca = Math.cos(a), sa = Math.sin(a);
  const D  = P.turnSpacing;
  const dir = P.flow === 'inward' ? -1 : 1;
  const F  = { a, ca, sa, D, dir };
  if (P.growth === 'log') {
    F.rho0 = P.baseRadius / ca;                     // rho at s = 0
    F.g    = 1 + D / F.rho0;                        // ratio between successive turns
    F.apex = new THREE.Vector3(0, 0, -P.baseRadius * sa / ca);
    F.rho  = s => F.rho0 * Math.pow(F.g, dir * s);
    // ribbon edges sit at rho * g^(±fill/2): symmetric in log space, so fill = 1 tiles exactly
    F.rhoAt = (s, v) => F.rho(s) * Math.pow(F.g, v * P.ribbonFill);
    F.scaleAt = s => Math.pow(F.g, dir * s);        // similarity factor between turn 0 and turn s
  } else {
    F.rho0 = ca > 0.02 ? P.baseRadius / ca : Infinity;
    F.apex = ca > 0.02 ? new THREE.Vector3(0, 0, -P.baseRadius * sa / ca) : null;
    F.rho  = s => F.rho0 + dir * D * s;
    F.rhoAt = (s, v) => F.rho(s) + v * P.ribbonFill * D;
    F.scaleAt = s => ca > 0.02 ? F.rho(s) / F.rho0 : 1;
  }
  return F;
}

// visible range of s, clamped in linear growth so the spiral's inner edge never crosses the axis
function sRange(F) {
  let sMin = nowDay() - P.daysPast - P.endFade / 24, sMax = nowDay() + P.daysFuture;
  if (P.growth === 'linear' && F.apex) {
    const sLimit = (F.rho0 - 0.5 * P.ribbonFill * F.D - 0.3 / F.ca) / F.D;
    if (F.dir > 0) sMin = Math.max(sMin, -sLimit); else sMax = Math.min(sMax, sLimit);
  }
  return [sMin, sMax];
}

// ---------------------------------------------------------------- layouts
// A layout maps strip coordinates to world space and defines a camera pose. Every view is a
// different layout of the same strip, so a transition is a lerp between two layouts.
//   s    = time in days (fractional part = time of day, 0 = today's midnight)
//   v    = lane across the strip, -0.5 (inner edge) .. 0.5 (outer edge)
//   lift = offset along the surface normal, for lines drawn on top
//   day  = which day segment s belongs to; only matters where the strip is cut at midnight
// strip: the world-space [length, width] of one day of strip, which sizes the day textures.
//   The flat and coil layouts widen the strip, which has more room there than on the spiral.
// icon: on-screen size of the point icons in px; text: font size of event names in px
// edgeW: width of the amber now edges, as a fraction of the strip width
// iconLabelLeft: put reminder names to the left of their icon, where the icon band is on the right
// basePose: the camera orbit shared by all layouts, from tilt / spin / zoom around a target.
// Distances are tuned for a landscape window; narrower ones back off so the width still fits.
const FIT_ASPECT = 1.6;
function basePose(target, dist, fitAspect = FIT_ASPECT) {
  dist *= Math.max(1, fitAspect / camera.aspect);
  const t = THREE.MathUtils.degToRad(P.tilt), sp = THREE.MathUtils.degToRad(P.spin);
  const pos = new THREE.Vector3(0, -dist * Math.sin(t), dist * Math.cos(t)).applyAxisAngle(Z, sp).add(target);
  const up  = new THREE.Vector3(0,  Math.cos(t), Math.sin(t)).applyAxisAngle(Z, sp);
  return { pos, up, target: target.clone() };
}

function makeLayouts() {
  const F = spiralFrame();
  const [sMin, sMax] = sRange(F);
  const sNow = nowDay(), today = Math.floor(sNow);
  const W = P.turnSpacing * P.ribbonFill;   // strip width in the flat layouts
  const L = 2 * Math.PI * P.baseRadius;     // one day unrolled: the length of turn 0
  const vGap = 0.5 / P.ribbonFill;          // middle of the gap outside the strip

  const spiral = {
    name: 'spiral', upright: false, defaultTilt: 0, F, range: [sMin, sMax], strip: [L, W], icon: 15, text: 12, edgeW: 0.04,
    place(s, v, lift = 0) {
      let r, z;
      if (F.apex) {
        const rho = F.rhoAt(s, v);
        r = rho * F.ca;
        z = F.apex.z + rho * F.sa;
      } else {                                      // cylinder wall
        r = P.baseRadius;
        z = F.dir * F.D * s + v * W;
      }
      const th = Math.PI / 2 - 2 * Math.PI * s;     // midnight at top, clockwise
      return new THREE.Vector3((r - lift * F.sa) * Math.cos(th), (r - lift * F.sa) * Math.sin(th), z + lift * F.ca);
    },
    anchorDay(d) { return this.place(d, vGap); },
    anchorHour(s) { return this.place(s, vGap); },
    spoke(s) { const m = this.place(s, 0.62, 0.03); return new THREE.Vector3(0, 0, m.z); },
    // scale the orbit about the cone apex by the similarity factor between turn 0 and now,
    // so the marker projects to the same screen point at every hour of every day
    camera() {
      const pose = basePose(new THREE.Vector3(0, 0, 0), 25 / P.zoom, 1.1);   // round, so it needs less width
      if (P.followTime) {
        if (F.apex) {

const FOCUS = [['Write API documentation', '#2f8f85'], ['Billing integration', '#3d6e9c'], ['Refactor auth middleware', '#3c7a72'],
  ['Fix flaky tests', '#4a6fa5'], ['Design system audit', '#5a7f6a'], ['Prototype search UI', '#2f7a9a'],

const wakeAt = k => { const r = rngFor(k, 'wake'); return isWeekend(k) ? between(r, 7.5, 9.25) : between(r, 6.5, 7.5); };

function sampleContent(dayMin, dayMax) {

    if ((k - 4) % 14 === 0) at(d, 'allday', 0, 24 * 12, `Sprint ${Math.floor((k - 4) / 14) % 100}`, '#5a6a3a');   // every other Monday
    if (d < dayMin - 4) continue;

    if (wk >= 1 && wk <= 3 && chance(r, 0.04)) at(d, 'allday', 0, 48, 'Offsite', '#3a8ad0');
    if (wk >= 2 && wk <= 4 && chance(r, 0.03)) at(d, 'allday', 0, 72, 'Conference', '#4a9a9a');
    if (wk === 5 && chance(r, 0.08)) at(d, 'allday', 0, 72, 'Weekend away', '#9a6a4a');
    if (isDayOff(k)) at(d, 'allday', 0, 24, 'Day off', '#7a9a5a');

    const ev = (s, e, n, c) => at(d, 'event', s, e, n, c);
    const wake = wakeAt(k);
    ev(wake + 0.25, wake + 1, free ? 'Slow breakfast' : 'Morning routine', '#7a8a3a');

    let dayEnd = 17;
    if (!free) {
      const r = rngFor(k, 'work');
      const office = chance(r, 0.7), ws = between(r, 8.5, 9.5, 0.5), we = ws + between(r, 8, 9, 0.5);
      at(d, 'context', ws, we, office ? 'At the office' : 'Working from home', office ? '#426a7a' : '#426e63');
      if (chance(r, 0.9)) ev(9.5, 9.75, 'Standup', '#5fb0a6');
      const lunch = between(r, 12, 13), lunchEnd = lunch + pick(r, [0.5, 0.75, 1]);
      ev(lunch, lunchEnd, pick(r, ['Lunch', 'Lunch', 'Lunch', 'Team lunch', `Lunch with ${pick(r, FRIENDS)}`]), '#8a7a4a');

        const s = Math.max(between(r, lo, hi), wake + 1.25), e = s + pick(r, lens);

    else if (wk === 5 && chance(r, 0.25)) { late = 24.5; ev(21.5, late, 'Concert', '#4f7fc0'); }
    else if (!free && chance(r, 0.06)) { late = 25.5; ev(22.5, late, 'Late deploy window', '#c0533f'); }

    const byUid = new Map();
    for (const ve of root.getAllSubcomponents('vevent')) {
      const uid = ve.getFirstPropertyValue('uid') || Math.random();
      if (!byUid.has(uid)) byUid.set(uid, []);
      byUid.get(uid).push(ve);
    }
    const add = (item, start, end) => {
      if (item.component.getFirstPropertyValue('status') === 'CANCELLED') return;
      const s = icalHours(start), n = item.summary || 'Busy';
      let e = icalHours(end);
      if (start.isDate) {
        e = Math.max(e, s + 24);
        if (e > lo && s < hi) ranges.push({ s, e, kind: 'allday', n, c: cal.color, cal: cal.title });
      } else if (e <= s) {
        if (s >= lo && s < hi) points.push({ t: s, kind: 'reminder', c: cal.color, n });
      } else if (e > lo && s < hi) {
        ranges.push({ s, e, kind: cal.kind, n, c: cal.color, cal: cal.title });
      }
    };
    for (const comps of byUid.values()) {
      const master = comps.find(c => !c.hasProperty('recurrence-id'));
      // pass the exceptions explicitly: left to itself, ical.js relates every exception in the file
      const exceptions = comps.filter(c => c !== master);
      if (!master) { for (const c of exceptions) { const ev = new ICAL.Event(c, { exceptions: [] }); add(ev, ev.startDate, ev.endDate); } continue; }
      const ev = new ICAL.Event(master, { exceptions });
      if (!ev.isRecurring()) { add(ev, ev.startDate, ev.endDate); continue; }
      const it = ev.iterator();
      for (let next, i = 0; (next = it.next()) && i < 20000; i++) {
        if (icalHours(next) > hi + 48) break;
        const o = ev.getOccurrenceDetails(next);
        add(o.item, o.startDate, o.endDate);
      }
    }
  }
  for (let d = dayMin; d <= dayMax; d++) sunPoints(points, d);
  packEvents(ranges.filter(r => r.kind === 'event'));
  packEvents(ranges.filter(r => r.kind === 'allday'));
  return { ranges, points, series: [] };
}

// Assign overlapping events to sub-lanes, per overlap cluster, so a lone event gets the
// whole band and only genuinely concurrent events share it. Packed once across all days,
// so an event that crosses midnight keeps its lane on both sides.
function packEvents(events) {
  events.sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], clusterEnd = -Infinity;
  const flush = () => {
    const laneEnds = [];
    for (const x of cluster) {
      let i = laneEnds.findIndex(end => end <= x.s + 1e-9);
      if (i < 0) { i = laneEnds.length; laneEnds.push(0); }
      laneEnds[i] = x.e; x.lane = i;
    }
    for (const x of cluster) x.lanes = laneEnds.length;
    cluster = [];
  };
  for (const x of events) {
    if (cluster.length && x.s >= clusterEnd - 1e-9) flush();
    cluster.push(x); clusterEnd = Math.max(clusterEnd, x.e);
  }
  if (cluster.length) flush();
}

// an event's box across the strip: texture-height fractions from the outer edge
function eventBox(r) {
  const [t0, t1] = BAND[r.kind === 'allday' ? 'allday' : 'event'], bh = (t1 - t0) / r.lanes;
  return [t0 + r.lane * bh, t0 + (r.lane + 1) * bh];
}
const yToV = y => 0.5 - y;            // texture fraction from the outer edge -> strip lane

const content = { data: sampleContent(-16, 16), tex: new Map() };
const strata = {
  pastDim: { value: P.pastDim }, pastDesat: { value: P.pastDesat },
  futureDim: { value: P.futureDim }, futureDesat: { value: P.futureDesat }, presentLift: { value: P.presentLift },
  nowLift: { value: P.nowLift },
};
// ?strip: stack the day textures at the bottom of the page, most recent day at the bottom
function layoutStrips() {
  const cvs = [...document.querySelectorAll('canvas[data-day]')].sort((a, b) => a.dataset.day - b.dataset.day);
  cvs.forEach((c, i) => c.style.bottom = (cvs.length - 1 - i) * 66 + 'px');
}
function invalidateContent() {
  for (const t of content.tex.values()) { t.map.dispose(); t.mat.dispose(); t.map.image.remove(); }
  content.tex.clear();
}

function dayMaterial(day) {
  let entry = content.tex.get(day);
  if (entry) return entry.mat;
  const cv = document.createElement('canvas');
  cv.width = tex.w; cv.height = tex.h;
  drawDay(cv.getContext('2d'), day);
  if (query.has('strip')) { cv.style.cssText = 'position:fixed;left:0;width:100%;height:64px;pointer-events:none;z-index:4;image-rendering:auto'; cv.dataset.day = day; document.body.appendChild(cv); layoutStrips(); }
  const map = new THREE.CanvasTexture(cv);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const mat = new THREE.MeshStandardMaterial({
    map, vertexColors: true, side: THREE.DoubleSide, roughness: 0.75, metalness: 0.05,
    transparent: true,
  });
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, strata);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float past; attribute float future; attribute float focus; attribute float fade; varying float vPast; varying float vFuture; varying float vFocus; varying float vFade;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPast = past; vFuture = future; vFocus = focus; vFade = fade;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float pastDim; uniform float pastDesat; uniform float futureDim; uniform float futureDesat; uniform float presentLift; uniform float nowLift; varying float vPast; varying float vFuture; varying float vFocus; varying float vFade;')
      .replace('#include <map_fragment>', `#include <map_fragment>
{
  float l = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));
  float present = (1.0 - vPast) * (1.0 - vFuture);
  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(l), clamp(vPast * pastDesat + vFuture * futureDesat, 0.0, 1.0));
  diffuseColor.rgb *= (1.0 - vPast * pastDim) * (1.0 - vFuture * futureDim) * (1.0 + present * presentLift + vFocus * nowLift);
  diffuseColor.a *= vFade;
}`)
      // part unlit, so the ribbon shows the colours it was painted with and lighting only models it
      .replace('#include <opaque_fragment>', 'outgoingLight = mix(outgoingLight, diffuseColor.rgb, 0.4);\n#include <opaque_fragment>');
  };
  content.tex.set(day, { map, mat });
  return mat;
}

// Marks are sized in u, 1% of the strip's width, so they keep their place in the bands at any
// texture resolution.
function drawDay(ctx, day) {
  const W = tex.w, H = tex.h, u = H / 100, px = W / 24, b = day * 24;
  const X = t => (t - b) * px;
  const { ranges, points, series } = content.data;
  const inDay = r => r.e > b && r.s < b + 24;
  const lighter = (c, l) => '#' + new THREE.Color(c).offsetHSL(0, 0.06, l).getHexString();
  const TAU = Math.PI * 2;

  ctx.fillStyle = '#373d49'; ctx.fillRect(0, 0, W, H);
  if (P.hourBands) {
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    for (let h = 0; h < 24; h += 2) ctx.fillRect(h * px, 0, px, H);
  }

  // context washes: full height, translucent. Sleep is hatched so it reads as time off by more
  // than its colour, and a solid rail on the inner edge keeps the context visible under events.
  const step = 7 * u, phase = ((day * W) % step + step) % step;    // hatch carries across midnight
  for (const r of ranges) if (r.kind === 'context' && inDay(r)) {
    const x0 = X(Math.max(r.s, b)), x1 = X(Math.min(r.e, b + 24));
    ctx.fillStyle = withAlpha(r.c, 0.62); ctx.fillRect(x0, 0, x1 - x0, H);
    if (r.hatch) {
      ctx.save(); ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, H); ctx.clip();
      ctx.beginPath();
      for (let x = -phase - Math.ceil(H / step) * step; x < x1; x += step) { ctx.moveTo(x, H); ctx.lineTo(x + H, 0); }
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1.1 * u; ctx.stroke();
      ctx.restore();
    }
    const [c0, c1] = BAND.context;
    ctx.fillStyle = lighter(r.c, 0.16); ctx.fillRect(x0, c0 * H, x1 - x0, (c1 - c0) * H);
  }

  // series: a hairline over a soft fill, inner band
  for (const sr of series) {
    const [t0, t1] = BAND.series, y = v => (t1 - (t1 - t0) * v) * H;
    ctx.beginPath();
    for (let t = b; t <= b + 24 + 1e-9; t += 1 / 12) ctx.lineTo(X(t), y(sr.at(t)));
    ctx.strokeStyle = withAlpha(sr.c, 0.9); ctx.lineWidth = 1.1 * u; ctx.lineJoin = 'round'; ctx.stroke();
    ctx.lineTo(W, t1 * H); ctx.lineTo(0, t1 * H); ctx.closePath();
    ctx.fillStyle = withAlpha(sr.c, 0.12); ctx.fill();
  }

  // events and all-day events: blocks in their sub-lanes with an even gap all round and a lighter
  // accent where they start. Ends are rounded and inset only where the block really starts or
  // ends, so a block cut at midnight runs square to the edge and continues on the next day.
  const gap = 1.2 * u;
  if (P.showTasks) for (const r of ranges) if ((r.kind === 'event' || r.kind === 'allday') && inDay(r)) {
    const [y0, y1] = eventBox(r), starts = r.s >= b, ends = r.e <= b + 24;
    const x0 = starts ? X(r.s) + gap : 0, x1 = ends ? X(r.e) - gap : W;
    const top = y0 * H + gap, hgt = (y1 - y0) * H - 2 * gap;
    if (x1 - x0 < 1 || hgt < 1) continue;
    const rad = Math.min(3.5 * u, hgt / 2, (x1 - x0) / 2);
    ctx.beginPath(); ctx.roundRect(x0, top, x1 - x0, hgt, [starts ? rad : 0, ends ? rad : 0, ends ? rad : 0, starts ? rad : 0]);
    ctx.fillStyle = r.kind === 'allday' ? withAlpha(r.c, 0.85) : r.c; ctx.fill();
    if (starts) {
      ctx.save(); ctx.clip();
      ctx.fillStyle = lighter(r.c, 0.2); ctx.fillRect(x0, top, Math.min(1.6 * u, x1 - x0), hgt);
      ctx.restore();
    }
  }

  // indicators: pills in the outer band
  const [i0, i1] = BAND.indicator, iy = (i0 + i1) / 2 * H, th = (i1 - i0) * H * 0.7;
  for (const r of ranges) if (r.kind === 'indicator' && inDay(r)) {
    const x0 = X(Math.max(r.s, b)), x1 = X(Math.min(r.e, b + 24));
    ctx.beginPath(); ctx.roundRect(x0, iy - th / 2, Math.max(th, x1 - x0), th, th / 2);
    ctx.fillStyle = r.c; ctx.fill();
  }

  // points: a deadline is a hairline across the strip with a notch on the outer edge, the sun a
  // disc with rays, a reminder a dot with a halo. Glyphs grow a little on the long thin strips,
  // where 1% of the width is only a fraction of a pixel.
  ctx.lineCap = 'round';
  const k = W / H > 10 ? 1.3 : 1, gy = Math.max(iy, 5.8 * k * u);
  for (const pt of points) if (pt.t >= b && pt.t < b + 24) {
    const x = X(pt.t), iy = gy, u = H / 100 * k;
    ctx.fillStyle = pt.c; ctx.strokeStyle = pt.c;
    if (pt.kind === 'deadline') {
      ctx.globalAlpha = 0.75; ctx.fillRect(x - 0.4 * u, 0, 0.8 * u, H); ctx.globalAlpha = 1;
      if (P.icons) continue;
      ctx.beginPath(); ctx.moveTo(x - 3.5 * u, 0); ctx.lineTo(x + 3.5 * u, 0); ctx.lineTo(x, 5 * u); ctx.closePath(); ctx.fill();
    } else if (P.icons) {
      continue;
    } else if (pt.kind === 'sun') {
      ctx.beginPath(); ctx.arc(x, iy, 2.6 * u, 0, TAU); ctx.fill();
      ctx.lineWidth = 0.8 * u; ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = k * TAU / 8, c = Math.cos(a), sn = Math.sin(a);
        ctx.moveTo(x + c * 4 * u, iy + sn * 4 * u); ctx.lineTo(x + c * 5.6 * u, iy + sn * 5.6 * u);
      }
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x, iy, 2.4 * u, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.lineWidth = 0.8 * u;
      ctx.beginPath(); ctx.arc(x, iy, 4.4 * u, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
}

// ---------------------------------------------------------------- scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = BG;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
// key light rides with the camera as a headlight, mostly along the view direction with a
// little from above-left so faces that squarely face the viewer are the brightest. Both the
// light and its target are parented to the camera, otherwise the light aims at the world origin.
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(1, 1.4, 1);
keyLight.target.position.set(0, 0, -3);
camera.add(keyLight, keyLight.target);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0x8a90b0, 0x34323c, 1.1));

const root = new THREE.Group();
scene.add(root);

let ribbonMesh = null, ribbonDays = [];   // for hover picking
const edgeMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55 });
const tickMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.7 });
const nowMat  = new THREE.LineBasicMaterial({ color: '#f39a2b' });
const postMat = new THREE.LineBasicMaterial({ color: '#f39a2b', transparent: true, opacity: 0.18 });
const dotMat  = new THREE.MeshBasicMaterial({ color: '#f39a2b' });
const NOW_AMBER = new THREE.Color('#f39a2b');
const railMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });

// Every built object keeps its vertex positions in both layouts; applyMorph lerps them.
let morphs = [];        // { geom, a, b, mesh }
let morphObjs = [];     // { obj, a, b }   (whole objects moved by position)

function morphGeometry(a, b, isMesh) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(a.length), 3));
  morphs.push({ geom: g, a: Float32Array.from(a), b: Float32Array.from(b), mesh: isMesh });
  return g;
}
function applyMorph() {
  const k = mixK(), j = 1 - k;
  for (const m of morphs) {
    const arr = m.geom.attributes.position.array;
    for (let i = 0; i < arr.length; i++) arr[i] = m.a[i] * j + m.b[i] * k;
    m.geom.attributes.position.needsUpdate = true;
    if (m.mesh) m.geom.computeVertexNormals();
    m.geom.computeBoundingSphere();
  }
  for (const o of morphObjs) o.obj.position.copy(o.a).lerp(o.b, k);
}

function clearRoot() {
  for (const o of [...root.children]) { root.remove(o); o.geometry?.dispose(); }
  morphs = []; morphObjs = [];
}

function push(arr, p) { arr.push(p.x, p.y, p.z); }

function build() {
  clearRoot();
  LAY = makeLayouts();
  const spec = texSpecFor(LAY[view.to]);
  if (spec.key !== tex?.key) { invalidateContent(); tex = spec; }
  const [sMin, sMax] = LAY[view.to].range;
  const stepsPerDay = 24 * 10;

  // --- ribbon surface, one run per day so the strip can tear at midnight. The vertex colour
  // carries only the past/future shading; the day's texture carries the content.
  const posA = [], posB = [], col = [], uv = [], past = [], future = [], focus = [], fade = [], idx = [], mats = [];
  const edgeA = [], edgeB = [], edgeCol = [];
  const days = [];
  let vi = 0;
  const g = morphGeometry([], [], true);        // filled below once the arrays are complete
  for (let day = Math.floor(sMin); day <= Math.floor(sMax); day++) {
    const a = Math.max(sMin, day), b = Math.min(sMax, day + 1);
    if (b - a <= 1e-6) continue;
    const n = Math.max(2, Math.round((b - a) * stepsPerDay));
    const idxStart = idx.length;
    let prevIn = null, prevOut = null;
    for (let i = 0; i <= n; i++) {
      const s = a + (b - a) * i / n;
      const c = shade(WHITE, s, false);
      const pi = pair(s, -0.5, 0, day), po = pair(s, 0.5, 0, day);
      push(posA, pi[0]); push(posA, po[0]); push(posB, pi[1]); push(posB, po[1]);
      col.push(c.r, c.g, c.b, c.r, c.g, c.b);
      uv.push(s - day, 0, s - day, 1);
      const pa = pastAt(s); past.push(pa, pa);
      const fu = futureAt(s); future.push(fu, fu);
      const fo = nowAt(s); focus.push(fo, fo);
      const fa = fadeAt(s); fade.push(fa, fa);
      if (i < n) idx.push(vi, vi + 1, vi + 2, vi + 1, vi + 3, vi + 2);
      vi += 2;
      // edges as segments, lifted a hair
      const ec = shade(new THREE.Color('#7a7e90'), s);
      if (P.nowEdges) ec.lerp(NOW_AMBER, nowAt(s));
      const li = pair(s, -0.5, 0.01, day), lo = pair(s, 0.5, 0.01, day);
      if (prevIn) {
        push(edgeA, prevIn[0]); push(edgeA, li[0]); push(edgeB, prevIn[1]); push(edgeB, li[1]);
        push(edgeA, prevOut[0]); push(edgeA, lo[0]); push(edgeB, prevOut[1]); push(edgeB, lo[1]);
        for (let k = 0; k < 4; k++) edgeCol.push(ec.r, ec.g, ec.b);
      }
      prevIn = li; prevOut = lo;
    }
    g.addGroup(idxStart, idx.length - idxStart, mats.length);
    mats.push(dayMaterial(day)); days.push(day);
  }
  const mg = morphs[morphs.length - 1];
  mg.a = Float32Array.from(posA); mg.b = Float32Array.from(posB);
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(posA.length), 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('past', new THREE.Float32BufferAttribute(past, 1));
  g.setAttribute('future', new THREE.Float32BufferAttribute(future, 1));
  g.setAttribute('focus', new THREE.Float32BufferAttribute(focus, 1));
  g.setAttribute('fade', new THREE.Float32BufferAttribute(fade, 1));
  g.setIndex(idx);
  ribbonMesh = new THREE.Mesh(g, mats); ribbonDays = days;
  root.add(ribbonMesh);

  if (P.showEdges) {
    const eg = morphGeometry(edgeA, edgeB, false);
    eg.setAttribute('color', new THREE.Float32BufferAttribute(edgeCol, 3));
    root.add(new THREE.LineSegments(eg, edgeMat));
  }

  // --- hour ticks
  if (P.showTicks) {
    const ta = [], tb = [], tc = [];
    const h0 = Math.ceil(sMin * 24), h1 = Math.floor(sMax * 24);
    for (let h = h0; h <= h1; h++) {
      const s = h / 24, hod = ((h % 24) + 24) % 24, day = Math.floor(s + 1e-9);
      const major = hod % 6 === 0, mid = hod % 3 === 0;
      const v0 = major ? -0.5 : mid ? 0.2 : 0.35;
      const p0 = pair(s, v0, 0.02, day), p1 = pair(s, 0.5, 0.02, day);
      push(ta, p0[0]); push(ta, p1[0]); push(tb, p0[1]); push(tb, p1[1]);
      const c = shade(new THREE.Color(major ? '#c9cbd6' : '#8d90a0'), s);
      tc.push(c.r, c.g, c.b, c.r, c.g, c.b);
    }
    const tg = morphGeometry(ta, tb, false);
    tg.setAttribute('color', new THREE.Float32BufferAttribute(tc, 3));
    root.add(new THREE.LineSegments(tg, tickMat));
  }

  // --- "now" marker: a line across the strip, a dot on the outer edge, a faint spoke to the axis
  const sNow = nowDay(), dNow = Math.floor(sNow);
  const m0 = pair(sNow, -0.5, 0.03, dNow), m1 = pair(sNow, 0.62, 0.03, dNow);
  const la = [], lb = [];
  push(la, m0[0]); push(la, m1[0]); push(lb, m0[1]); push(lb, m1[1]);
  root.add(new THREE.LineSegments(morphGeometry(la, lb, false), nowMat));
  const dotPair = pair(sNow, 0.5, 0.03, dNow);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.07 * (LAY.spiral.F.scaleAt(sNow) || 1), 16, 12), dotMat);
  morphObjs.push({ obj: dot, a: dotPair[0], b: dotPair[1] });
  root.add(dot);
  const spokes = [LAY[view.from].spoke(sNow) || m1[0], LAY[view.to].spoke(sNow) || m1[1]];
  const sa = [], sb = [];
  push(sa, m1[0]); push(sa, spokes[0]); push(sb, m1[1]); push(sb, spokes[1]);
  root.add(new THREE.LineSegments(morphGeometry(sa, sb, false), postMat));

  // --- now edges: through the now stretch the ribbon's edges turn amber, like a selection
  // outline. The edge lines take the colour above; a thin band just inside each edge gives it
  // weight, since WebGL lines are only a pixel wide.
  if (P.nowEdges) {
    const A = LAY[view.from], B = LAY[view.to], ra = [], rb = [], rc = [], ri = [];
    const t0 = Math.max(sMin, sNow - P.nowBehind / 24), t1 = Math.min(sMax, sNow + P.nowAhead / 24);
    let vi = 0;
    for (const side of [1, -1])
      for (let day = Math.floor(t0); day <= Math.floor(t1); day++) {
        const a = Math.max(t0, day), b = Math.min(t1, day + 1);
        if (b - a <= 1e-6) continue;
        const n = Math.max(2, Math.round((b - a) * 24 * 20));
        for (let i = 0; i <= n; i++) {
          const s = a + (b - a) * i / n, k = nowAt(s);
          const vo = side * 0.5;
          push(ra, A.place(s, vo - side * A.edgeW, 0.012, day)); push(ra, A.place(s, vo, 0.012, day));
          push(rb, B.place(s, vo - side * B.edgeW, 0.012, day)); push(rb, B.place(s, vo, 0.012, day));
          rc.push(NOW_AMBER.r, NOW_AMBER.g, NOW_AMBER.b, 0.85 * k, NOW_AMBER.r, NOW_AMBER.g, NOW_AMBER.b, 0.85 * k);
          if (i < n) ri.push(vi, vi + 1, vi + 2, vi + 1, vi + 3, vi + 2);
          vi += 2;
        }
      }
    if (vi) {
      const rg = morphGeometry(ra, rb, false);
      rg.setAttribute('color', new THREE.Float32BufferAttribute(rc, 4));
      rg.setIndex(ri);
      const band = new THREE.Mesh(rg, railMat);
      band.renderOrder = 1;      // after the ribbon, which is transparent too and would paint over it
      root.add(band);
    }
  }

  buildLabels(sMin, sMax);
  applyMorph();
}

// ---------------------------------------------------------------- overlay labels
// Each label has a 3D anchor pair (one per layout) and is positioned in screen space every
// frame. Elements are keyed and reused so rebuilding while time plays does not churn the DOM.
const overlay = document.getElementById('overlay');
const labelPool = new Map();
let labels = [];
// Curved event names: SVG text on a path traced through the label's projected arc points.
const SVGNS = 'http://www.w3.org/2000/svg';
const curves = document.createElementNS(SVGNS, 'svg');

      : r.s != null ? `${fmtClock(r.s)}–${fmtClock(r.e)}${Math.floor(r.e / 24) > Math.floor(r.s / 24) ? ' (+1d)' : ''}` : '';
    const what = r.kind === 'allday' ? 'all day' : r.cal && r.kind === 'event' ? '' : r.kind;
    html += `<div><span class="sw" style="background:${r.c}"></span>${esc(r.n)} <span class="h">${[r.cal && esc(r.cal), what, when].filter(Boolean).join(' · ')}</span></div>`;
  }
  if (y >= BAND.series[0] && y < BAND.series[1]) for (const sr of series) html += `<div><span class="sw" style="background:${sr.c}"></span>${sr.n} <span class="h">${Math.round(sr.at(t) * 100)}%</span></div>`;
  tip.innerHTML = html;
  tip.style.display = 'block';
  tip.style.left = Math.max(12, Math.min(e.clientX + 14, w - tip.offsetWidth - 12)) + 'px';
  tip.style.top = Math.max(12, Math.min(e.clientY + 14, h - tip.offsetHeight - 12)) + 'px';
}

canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    P.zoom = THREE.MathUtils.clamp(pinch.zoom * pinchDist() / pinch.d, 0.2, 4);
    updateCamera(); refreshGui();
    return;
  }
  if (!drag) { if (e.pointerType === 'mouse') hover(e); return; }
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 8) return;
  tap = null;
  tip.style.display = 'none';
  P.spin = (P.spin - (e.clientX - drag.x) * 0.3) % 360;
  P.tilt = THREE.MathUtils.clamp(P.tilt + (e.clientY - drag.y) * 0.25, 0, 80);
  drag = { x: e.clientX, y: e.clientY };
  view.anim = false;                       // a manual tilt overrides the transition's tilt tween
  updateCamera(); refreshGui();
});
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') tip.style.display = 'none'; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  P.zoom = THREE.MathUtils.clamp(P.zoom * Math.exp(-e.deltaY * 0.001), 0.2, 4);
  updateCamera(); refreshGui();
}, { passive: false });

// ---------------------------------------------------------------- gui
const rebuild = () => { build(); updateCamera(); };
const gui = new GUI({ title: 'Display settings', width: 280 }).close();
const gView = gui.addFolder('view');
gView.add(P, 'view', ['spiral', 'coil', 'linear', 'week']).onChange(n => { setView(n); rebuild(); });
gView.add(P, 'morph', 0, 1, 0.001).name('transition').onChange(() => { view.anim = false; applyMorph(); updateCamera(); });
gView.add(P, 'tilt', 0, 80, 1).name('tilt °').onChange(updateCamera);
gView.add(P, 'spin', -180, 180, 1).name('spin °').onChange(updateCamera);
gView.add(P, 'zoom', 0.2, 4, 0.01).onChange(updateCamera);
gView.add(P, 'followTime').name('follow time').onChange(updateCamera);
const gShape = gui.addFolder('shape');
gShape.add(P, 'flow', ['inward', 'outward']).onChange(rebuild);
gShape.add(P, 'growth', ['log', 'linear']).onChange(rebuild);
gShape.add(P, 'coneAngle', 0, 90, 1).name('cone angle °').onChange(rebuild);
gShape.add(P, 'turnSpacing', 0.3, 2.5, 0.05).name('turn spacing').onChange(rebuild);
gShape.add(P, 'ribbonFill', 0.3, 1, 0.01).name('ribbon fill').onChange(rebuild);
gShape.add(P, 'baseRadius', 2, 10, 0.1).name('base radius').onChange(rebuild);
gShape.add(P, 'coilPitch', 0.1, 2, 0.05).name('coil pitch').onChange(rebuild);
gShape.add(P, 'daysPast', 0, 10, 1).name('days past').onChange(rebuild);
gShape.add(P, 'daysFuture', 0, 6, 1).name('days future').onChange(rebuild);
const gTime = gui.addFolder('time & layers');
const nowCtrl = gTime.add(P, 'nowHour', -24, 72, 0.05).name('now (h)').onChange(() => { P.live = false; refreshGui(); rebuild(); });
gTime.add(P, 'live').name('live clock').onChange(v => {
  if (!v) return;
  P.play = false; P.nowHour = liveHour(); refreshGui(); rebuild();
});
gTime.add(P, 'play').onChange(v => { if (v) { P.live = false; refreshGui(); } });
gTime.add(P, 'speed', 0.1, 24, 0.1).name('speed (h/s)');
gTime.add(P, 'showTasks').name('events').onChange(() => { invalidateContent(); build(); });
gTime.add(P, 'showTicks').name('hour ticks').onChange(build);
gTime.add(P, 'showEdges').name('edges').onChange(build);
gTime.add(P, 'hourBands').name('hour bands').onChange(() => { invalidateContent(); build(); });
gTime.add(P, 'labels').name('labels').onChange(build);
gTime.add(P, 'taskLabels').name('event labels').onChange(build);
gTime.add(P, 'icons').onChange(() => { invalidateContent(); build(); });
gTime.add(P, 'curvedLabels').name('curved labels');
gTime.add(P, 'labelDays', 0.25, 4, 0.25).name('label range (d)').onChange(build);
const gPast = gui.addFolder('past · present · future');
gPast.add(P, 'pastDim', 0, 1, 0.01).name('past dim').onChange(v => strata.pastDim.value = v);
gPast.add(P, 'pastDesat', 0, 1, 0.01).name('past desaturate').onChange(v => strata.pastDesat.value = v);
gPast.add(P, 'pastEdge', 0.25, 48, 0.25).name('past edge (h)').onChange(build);
gPast.add(P, 'presentBehind', 0, 24, 0.25).name('present behind (h)').onChange(build);
gPast.add(P, 'presentSpan', 0, 24, 0.25).name('present ahead (h)').onChange(build);
gPast.add(P, 'presentLift', 0, 0.5, 0.01).name('present lift').onChange(v => strata.presentLift.value = v);
gPast.add(P, 'nowEdges').name('now edges').onChange(build);
gPast.add(P, 'nowBehind', 0, 6, 0.25).name('now behind (h)').onChange(build);
gPast.add(P, 'nowAhead', 0.5, 12, 0.25).name('now ahead (h)').onChange(build);
gPast.add(P, 'nowLift', 0, 0.5, 0.01).name('now lift').onChange(v => strata.nowLift.value = v);
gPast.add(P, 'futureEdge', 0.25, 12, 0.25).name('future edge (h)').onChange(build);
gPast.add(P, 'futureDim', 0, 1, 0.01).name('future dim').onChange(v => strata.futureDim.value = v);
gPast.add(P, 'futureDesat', 0, 1, 0.01).name('future desaturate').onChange(v => strata.futureDesat.value = v);
gPast.add(P, 'endFade', 0, 24, 0.25).name('end feather (h)').onChange(build);
gui.add({ topDown() { P.tilt = 0; P.spin = 0; view.anim = false; updateCamera(); refreshGui(); } }, 'topDown').name('↓ top-down (2D view)');
function refreshGui() { gui.controllersRecursive().forEach(c => c.updateDisplay()); updateClockState(); }
function updateClockState() {
  const el = document.getElementById('clock-state');
  el.textContent = P.live ? 'Live' : P.play ? 'Playing · Go live' : 'Go live';
  el.dataset.live = P.live;
  el.setAttribute('aria-label', P.live ? 'Live clock active' : 'Return to the live clock');
  const currentDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + Math.floor(nowDay()));
  document.getElementById('date').textContent = currentDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
document.getElementById('clock-state').addEventListener('click', () => {
  P.live = true; P.play = false; P.nowHour = liveHour(); rebuild(); refreshGui();
});
for (const [id, factor] of [['zoom-in', 1.2], ['zoom-out', 1 / 1.2]]) {
  document.getElementById(id).addEventListener('click', () => {
    P.zoom = THREE.MathUtils.clamp(P.zoom * factor, 0.2, 4); updateCamera(); refreshGui();
  });
}
document.getElementById('zoom-reset').addEventListener('click', () => {
  P.zoom = 1; P.tilt = LAY[view.to].defaultTilt; P.spin = LAY[view.to].defaultSpin || 0;
  P.morph = 1; view.anim = false; rebuild(); refreshGui();
});
for (const b of viewButtons) b.addEventListener('click', () => {
  if (b.dataset.view === view.to) return;
  P.view = b.dataset.view; setView(P.view); rebuild(); refreshGui();
});
// ---------------------------------------------------------------- real calendars
// cal/index.json exists when serve.mjs or npm run fetch has run; otherwise (GitHub Pages, ?mock)
// the sample calendar stays. The legend then lists the calendars, with a Refresh button that asks
// serve.mjs to download them again.
const legend = document.getElementById('legend');
const ICAL_URL = 'https://cdn.jsdelivr.net/npm/ical.js@2.2.1/dist/ical.js';
const titleCase = s => s.replace(/_/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
async function loadCalendars() {
  if (query.has('mock')) return;
  let index;
  try {
    const res = await fetch('cal/index.json', { cache: 'no-store' });
    if (!res.ok) return;
    index = await res.json();
  } catch { return; }
  if (index.sun && !SUN.fixed) Object.assign(SUN, index.sun);
  const listed = index.calendars.filter(c => c.file);
  if (!listed.length) { content.data = sampleContent(-16, 16); invalidateContent(); rebuild(); return showLegend(index, []); }
  const [{ default: ICAL }, texts] = await Promise.all([import(ICAL_URL),
    Promise.all(listed.map(c => fetch('cal/' + c.file, { cache: 'no-store' }).then(r => r.text())))]);
  const cals = listed.map((c, i) => ({ title: titleCase(c.name), color: c.color || CAL_COLORS[i % CAL_COLORS.length],
    kind: c.kind === 'context' ? 'context' : 'event', text: texts[i] }));
  content.data = calendarContent(ICAL, cals, -16, 16);
  invalidateContent(); rebuild();
  showLegend(index, cals);
}
function showLegend(index, cals) {
  const failed = index.calendars.filter(c => !c.ok);
  const fetched = new Date(index.fetched).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  legend.innerHTML = cals.map(c => `<span><i style="--swatch:${esc(c.color)}"></i>${esc(c.title)}</span>`).join('')
    + `<span><i style="--swatch:#e8b865"></i>Now</span>`
    + `<span class="sample">Updated ${fetched}${failed.length ? ` · <span class="warn" title="${esc(failed.map(c => `${c.name}: ${c.error}`).join('\n'))}">${failed.length} failed</span>` : ''}`
    + `<button type="button" id="cal-refresh">Refresh</button></span>`;
  document.getElementById('cal-refresh').addEventListener('click', refreshCalendars);
}
async function refreshCalendars() {
  const btn = document.getElementById('cal-refresh');
  btn.disabled = true; btn.textContent = 'Refreshing…';
  const res = await fetch('api/refresh', { method: 'POST' }).catch(() => null);
  if (!res?.ok) {
    // a plain static server has no api/refresh: npm start provides it
    const missing = !res || res.status === 404 || res.status === 405 || res.status === 501;
    btn.textContent = missing ? 'Needs npm start' : 'Refresh failed';
    btn.title = missing ? 'Refresh needs the local server: npm start' : `server answered ${res.status}`;
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Refresh'; }, 4000);
    return;
  }
  await loadCalendars().catch(e => console.error('calendars:', e.message));
}

document.getElementById('hint').textContent = matchMedia('(pointer: coarse)').matches
  ? 'drag to tilt and spin · pinch to zoom · tap for details'
  : 'drag to tilt and spin · scroll to zoom · hover for details';

// ---------------------------------------------------------------- go
resize();
rebuild();
showView();
updateClockState();
loadCalendars().catch(e => console.error('calendars:', e.message));
const TRANSITION_S = 0.9;
let last = performance.now();
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - last) / 1000, 0.1); last = t;
  let tick = false;
  if (P.play) { P.nowHour += P.speed * dt; nowCtrl.updateDisplay(); tick = true; }
  else if (P.live) {
    // rebuild only when the minute shown in the readout changes
    const h = liveHour();
    if (Math.floor(h * 60) !== Math.floor(P.nowHour * 60)) { P.nowHour = h; nowCtrl.updateDisplay(); tick = true; }
  }
  const wasAnimating = view.anim;
  if (view.anim) {
    P.morph = Math.min(1, P.morph + dt / TRANSITION_S);
    P.tilt = THREE.MathUtils.lerp(view.tiltFrom, view.tiltTo, mixK());
    P.spin = THREE.MathUtils.lerp(view.spinFrom, view.spinTo, mixK());
    if (P.morph >= 1) view.anim = false;
    refreshGui();
  }
  if (tick) { rebuild(); updateClockState(); }
  else if (wasAnimating) { applyMorph(); updateCamera(); }
  renderer.render(scene, camera);
  updateOverlay();
  if (query.has('debug')) {
    const i = renderer.info.render;
    document.getElementById('hint').textContent =
      `gl ${renderer.getContext().getParameter(renderer.getContext().RENDERER)} · calls ${i.calls} · tris ${i.triangles} · lines ${i.lines} · view ${view.from}→${view.to} k=${P.morph.toFixed(2)}`;
  }
});
</script>
